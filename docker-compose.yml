# API only, for working on librelock-server
# For a full instance use the one-command stack in https://github.com/LibreLock/.github
services:
  api:
    build:
      context: .
      args:
        # docker compose build --build-arg VERSION=$(git describe --tags)
        VERSION: ${VERSION:-dev}
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: .env
    environment:
      DB_PATH: /app/data/librelock.db
    volumes:
      - sqlite_data:/app/data

volumes:
  sqlite_data:
